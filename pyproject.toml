[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-data-pipeline"
version = "1.0.0"
description = "An API-to-PostgreSQL weather data pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
